name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Both engines run because development is MariaDB and production is
    # MySQL 8.0. The suite needs a real engine either way: the double-booking
    # guarantee is a database constraint, so SQLite would prove the wrong thing.
    strategy:
      fail-fast: false
      matrix:
        engine: ["mysql:8.0", "mariadb:10.11"]

    services:
      db:
        image: ${{ matrix.engine }}
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: localshouts_stays
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: localshouts_stays
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:ci@127.0.0.1:3306/localshouts_stays?charset=utf8mb4
          PYTHONIOENCODING: utf-8
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Design-system drift
        # The vendored design system is the pixel contract. A silent edit would
        # make "matches the approved design" untrue without anyone noticing.
        working-directory: frontend
        run: npm run verify:ds

      - name: Build
        working-directory: frontend
        run: npm run build
