name: Deploy stays on push

on:
  push:
    branches:
      - production
      - staging

jobs:
  web-deploy:
    name: Deploy LeadMiner
    runs-on: ubuntu-latest
    steps:
      #- name: Install sshpass
      #  run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          sshpass -p '${{ secrets.SSHPASSWORD }}' ssh -p 522 -o StrictHostKeyChecking=no thermalcoderz@thermalcode.com '
            set -e
            source ~/.nvm/nvm.sh
            # Match CI (node-version: 22). Without an explicit use, nvm falls back
            # to the default alias (18), and npm silently skips optional deps that
            # fail their engine check -- so @tailwindcss/oxide never gets its Linux
            # binary and the build dies on "Cannot find native binding".
            nvm install 22
            nvm use 22
            cd ~/stays && git fetch origin && git reset --hard origin/staging
            #cd ~/stays/backend && venv/bin/pip install -r requirements.txt
            cd ~/stays/backend && venv/bin/python -m alembic upgrade head
            # Cold build every time. next build reuses .next/cache, and a tree
            # left inconsistent by an earlier run -- an interrupted build, or a
            # partial invalidation -- reuses chunks it never rewrites, so the
            # build "compiles successfully" and then dies collecting page data
            # with "Cannot find module for page: /login". Seconds of rebuild
            # against a deploy that fails after the compile step.
            cd ~/stays/frontend && npm ci && rm -rf .next && npm run build
            # Only the build needs 22. pm2 is installed under the default Node and
            # nvm scopes global binaries per version, so switch back or it vanishes
            # from PATH -- and the apps keep the runtime they have always had.
            nvm use default
            pm2 restart stays
            pm2 restart stays-front

          '
