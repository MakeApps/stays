[project]
name = "localshouts-stays"
version = "0.1.0"
description = "LocalShouts Stays — property management API"
requires-python = ">=3.12"

dependencies = [
    "Flask>=3.0",
    "SQLAlchemy>=2.0",
    "Flask-SQLAlchemy>=3.1",
    "alembic>=1.13",
    # PyMySQL is pure Python: no build toolchain needed in a slim runtime image.
    "PyMySQL>=1.1",
    # [email] pulls email-validator, needed by EmailStr on the login payload.
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "Flask-Cors>=4.0",
    "Flask-Limiter>=3.7",
    # Magic-byte sniffing without libmagic — python-magic needs a native DLL on Windows.
    "filetype>=1.2",
    "Pillow>=10.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyMySQL",
    # gunicorn has no Windows support (no fcntl); waitress is the local prod-like server.
    "waitress>=3.0",
]
prod = [
    "gunicorn>=22.0",
    "WeasyPrint>=61.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # Flask/Depends-style defaults
    # `class Role(str, Enum)` is the standard SQLAlchemy pattern: members stay
    # JSON-serialisable and compare equal to their stored value.
    "UP042",
    # PEP 695 type parameters. TypeVar/Generic is still correct and reads more
    # clearly alongside `from __future__ import annotations`.
    "UP046",
    "UP047",
    # Prose in docstrings and comments uses en dashes deliberately.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["flask_limiter.*", "filetype.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real MySQL/MariaDB connection",
    "concurrency: spawns threads against the real engine",
]
