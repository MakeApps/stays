[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is supplied at runtime from Settings.DATABASE_URL (see
# migrations/env.py) so credentials never live in a committed file.

# No post-write hooks: formatting generated migrations via an entrypoint hook
# fails when the tool is not exposed as a console_script, and a failed hook
# leaves the revision half-processed. Run `ruff format migrations/` instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
